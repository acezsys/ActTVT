<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Order Management…</title>
<style>
  :root {
    --navy: #1e3450;
    --navy-dark: #14263b;
    --steel: #3a6ea5;
    --text-muted: rgba(255,255,255,0.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy-dark);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--steel);
    border-radius: 50%;
    margin: 0 auto 22px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  p.sub { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .fallback { display: none; margin-top: 22px; }
  .fallback a {
    color: #fff; background: var(--steel); text-decoration: none;
    padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
  }
  .prowessz-logo {
    display: inline-flex; align-items: center; background: #fff; border-radius: 8px;
    padding: 12px 20px; margin-top: 32px; line-height: 0;
  }
  .prowessz-logo img { height: 65px; width: auto; display: block; }
</style>
</head>
<body>

<div class="box">
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="message">Loading text goes here</h1>
  <p class="sub" id="submessage">Subtext goes here.</p>
  <div class="fallback" id="fallback">
    <a id="fallback-link" href="#">Continue anyway</a>
  </div>
  <div>
    <a class="prowessz-logo" href="https://www.prowessz.com" target="_blank" rel="noopener noreferrer" title="Visit Prowessz Consulting">
      <img src="prowessz-logo.png" alt="Prowessz Consulting">
    </a>
  </div>
</div>

<script>
  // ============================================================
  // EDIT THESE THREE LINES — nothing else needs to change.
  // ============================================================
  const APP_URL = "https://arieckal-erp.onrender.com";
  const LOADING_MESSAGE = "Getting things ready…";
  const LOADING_SUBMESSAGE = "This can take up to a minute the first time.";
  // ============================================================

  document.getElementById('message').textContent = LOADING_MESSAGE;
  document.getElementById('submessage').textContent = LOADING_SUBMESSAGE;
  document.getElementById('fallback-link').href = APP_URL;

  const CHECK_EVERY_MS = 3000;
  const GIVE_UP_AFTER_MS = 75000; // show a manual link if it's genuinely still not up after this
  const startedAt = Date.now();

  async function checkAndMaybeRedirect() {
    try {
      const res = await fetch(APP_URL + '/api/health', { cache: 'no-store' });
      if (res.ok) {
        window.location.href = APP_URL;
        return;
      }
    } catch (err) {
      // Still asleep or waking up — this is expected, just keep trying.
    }

    if (Date.now() - startedAt > GIVE_UP_AFTER_MS) {
      document.getElementById('fallback').style.display = 'block';
      document.getElementById('submessage').textContent = "Taking longer than usual — you can try continuing manually.";
    } else {
      setTimeout(checkAndMaybeRedirect, CHECK_EVERY_MS);
    }
  }

  checkAndMaybeRedirect();
</script>

</body>
</html>
